<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioFeedback Trainer</title>
    <style>
        :root { --primary: #00f2ff; --bg: #121212; --card: #1e1e1e; --success: #00ff88; --warn: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        /* Layout Grid */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .big-num { font-size: 2.5rem; font-weight: 800; display: block; }
        .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }

        /* Botones de Modos */
        .mode-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;}
        .mode-btn { background: #333; color: white; border: 1px solid #555; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .mode-btn.active { background: var(--primary); color: black; border-color: var(--primary); font-weight: bold; }

        /* Área de Feedback Principal */
        .main-feedback { background: #000; padding: 30px; border-radius: 20px; border: 2px solid #333; margin-bottom: 20px; position: relative; overflow: hidden; }
        #instruction-text { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; transition: color 0.3s; }
        #sub-text { color: #aaa; }
        
        /* Barras de Progreso */
        .bar-container { height: 10px; background: #333; border-radius: 5px; margin-top: 15px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.5s ease-out; }

        /* Botones Conexión */
        .conn-panel { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .btn-connect { padding: 8px 15px; border: none; border-radius: 5px; background: #444; color: white; cursor: pointer; }
        .connected { background: var(--success); color: black; }

    </style>
</head>
<body>

    <!-- Panel de Estado -->
    <div class="dashboard">
        <div class="stat-card">
            <span class="label">Ritmo Cardíaco</span>
            <span class="big-num" id="hr-value">--</span>
            <span class="label">BPM</span>
        </div>
        <div class="stat-card">
            <span class="label">Tiempo en Pico (>70%)</span>
            <span class="big-num" id="squeeze-value">0.0s</span>
            <span class="label">Última Rep</span>
        </div>
    </div>

    <!-- Selector de Programa -->
    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('HIIT')">🔥 HIIT Metabólico</button>
        <button class="mode-btn" onclick="setMode('HYPER')">💪 Hipertrofia</button>
        <button class="mode-btn" onclick="setMode('FLOW')">❤️ Cardio Flow</button>
    </div>

    <!-- Feedback Central (El "Entrenador Virtual") -->
    <div class="main-feedback" id="feedback-panel">
        <div id="instruction-text">Conecta los sensores</div>
        <div id="sub-text">Selecciona un modo para empezar</div>
        
        <div class="bar-container">
            <div id="performance-bar" class="bar-fill" style="background: var(--primary);"></div>
        </div>
    </div>

    <div class="stat-card" style="max-width: 200px; margin: 0 auto;">
        <span class="label">Repeticiones Totales</span>
        <span class="big-num" id="total-reps">0</span>
    </div>

    <!-- Conexiones -->
    <div class="conn-panel">
        <button class="btn-connect" id="btn-hr" onclick="connectHR()">❤️ Conectar Pulso</button>
        <button class="btn-connect" id="btn-esp" onclick="connectESP()">⚡ Conectar Máquina</button>
    </div>

<script>
    // --- ESTADO DEL SISTEMA ---
    let state = {
        hr: 0,
        lastRepTime: 0,
        squeezeTime: 0, // Tiempo entre subida y bajada (zona > 70%)
        reps: 0,
        mode: 'HIIT', // HIIT, HYPER, FLOW
        userMaxHR: 190, // Configurable (220 - edad)
    };

    // --- LÓGICA DE LOS PROGRAMAS DE ENTRENAMIENTO ---

    function evaluatePerformance() {
        const text = document.getElementById('instruction-text');
        const sub = document.getElementById('sub-text');
        const bar = document.getElementById('performance-bar');
        const panel = document.getElementById('feedback-panel');

        // Cálculo de % HR
        const hrZone = (state.hr / state.userMaxHR) * 100;

        if (state.mode === 'HIIT') {
            // OBJETIVO: Mantener HR alto (>80%). Repeticiones rápidas.
            if (hrZone < 75) {
                text.innerText = "¡MÁS RÁPIDO! ⚡";
                text.style.color = "var(--warn)";
                sub.innerText = `Sube pulsaciones (Estás al ${hrZone.toFixed(0)}%)`;
                panel.style.borderColor = "var(--warn)";
            } else if (hrZone > 92) {
                text.innerText = "¡RESPIRA! 🛑";
                text.style.color = "var(--danger)";
                sub.innerText = "Pulsaciones demasiado altas";
                panel.style.borderColor = "var(--danger)";
            } else {
                text.innerText = "¡RITMO PERFECTO! 🔥";
                text.style.color = "var(--success)";
                sub.innerText = "Mantén esa intensidad";
                panel.style.borderColor = "var(--success)";
            }
            // Barra muestra intensidad cardíaca
            bar.style.width = hrZone + "%";
            bar.style.background = hrZone > 90 ? "red" : (hrZone > 75 ? "#00ff88" : "yellow");
        } 
        
        else if (state.mode === 'HYPER') {
            // OBJETIVO: Calidad mecánica. Tiempo >70% debe ser > 1s. Descanso si HR es alto.
            
            // 1. Chequeo de descanso primero
            if (hrZone > 70) {
                text.innerText = "DESCANSANDO... 🛌";
                text.style.color = "#aaa";
                sub.innerText = `Espera a bajar a 60% (Actual: ${hrZone.toFixed(0)}%)`;
                panel.style.borderColor = "#333";
                bar.style.width = hrZone + "%";
                bar.style.background = "orange";
                return; // No pedir ejercicio
            }

            // 2. Feedback de la última repetición
            if (state.squeezeTime < 0.8) {
                text.innerText = "¡DEMASIADO RÁPIDO! 🐢";
                text.style.color = "var(--warn)";
                sub.innerText = "Sostén arriba. Quema más.";
                panel.style.borderColor = "var(--warn)";
            } else {
                text.innerText = "¡BUENA CONTRACCIÓN! 💪";
                text.style.color = "var(--success)";
                sub.innerText = "Así se construye músculo.";
                panel.style.borderColor = "var(--success)";
            }
            // Barra muestra la calidad de la contracción (objetivo 2s)
            let quality = (state.squeezeTime / 2.0) * 100;
            if (quality > 100) quality = 100;
            bar.style.width = quality + "%";
            bar.style.background = state.squeezeTime < 0.8 ? "yellow" : "#00ff88";
        }

        else if (state.mode === 'FLOW') {
            // OBJETIVO: Cardio estable (Zona 3: 70-80%). Adaptar ritmo.
            const targetMin = 70; 
            const targetMax = 80;

            if (hrZone < targetMin) {
                text.innerText = "Aumenta Cadencia 🔼";
                text.style.color = "white";
                panel.style.borderColor = "#00d2ff";
            } else if (hrZone > targetMax) {
                text.innerText = "Disminuye Cadencia 🔽";
                text.style.color = "white";
                panel.style.borderColor = "#ffaa00";
            } else {
                text.innerText = "⚡ ZONA DE FLUJO ⚡";
                text.style.color = "var(--primary)";
                panel.style.borderColor = "var(--primary)";
            }
             sub.innerText = `Objetivo Zona 3 (135-155 BPM)`;
             bar.style.width = hrZone + "%";
             bar.style.background = (hrZone >= targetMin && hrZone <= targetMax) ? "#00f2ff" : "#444";
        }
    }

    // --- GESTIÓN DE ENTRADA DE DATOS (Sensores) ---

    // 1. Datos del ESP32 (Máquina)
    function handleMachineData(dataView) {
        // Asumimos formato enviado por ESP32: [flag(1), tiempoMs(2)]
        // El ESP32 envía esto SOLO cuando se completa la fase de BAJADA (cruzando el 75% hacia abajo)
        
        // Simulación de decodificación (ajustar a tu firmware)
        // Ejemplo: Bytes [0] = ID, Bytes [1-2] = uint16 (milisegundos entre subida y bajada)
        
        // NOTA: Para este ejemplo, suponemos que el value viene como texto o un float directo para facilitar
        // En producción usa dataView.getUint16(0, true);
        
        // Simularemos que recibimos el tiempo en segundos directamente
        // let squeezeMs = dataView.getUint16(0, true); 
        // state.squeezeTime = squeezeMs / 1000;
        
        // *Simulación para test visual sin BT real:*
        // state.squeezeTime = Math.random() * 2; 

        state.reps++;
        document.getElementById('total-reps').innerText = state.reps;
        document.getElementById('squeeze-value').innerText = state.squeezeTime.toFixed(1) + "s";
        
        // Ejecutar lógica del programa justo al terminar la rep
        evaluatePerformance();
    }

    // 2. Datos del Ritmo Cardíaco
    function handleHRData(event) {
        const value = event.target.value;
        const hr = value.getUint8(1);
        state.hr = hr;
        document.getElementById('hr-value').innerText = hr;
        
        // Ejecutar lógica continua (para monitorear descanso o zonas)
        evaluatePerformance();
    }


    // --- CONEXIÓN BLUETOOTH (Standard Web API) ---
    
    // Configuración UUIDs (Reemplazar con los tuyos del ESP32)
    const SRV_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b'; 
    const CHAR_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    async function connectESP() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'Ab' }], // Nombre de tu ESP32
                optionalServices: [SRV_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SRV_UUID);
            const char = await service.getCharacteristic(CHAR_UUID);
            await char.startNotifications();
            char.addEventListener('characteristicvaluechanged', (e) => {
                // Aquí extraes el valor real.
                // Asumiendo que envias un Float32 desde ESP:
                state.squeezeTime = e.target.value.getFloat32(0, true); 
                handleMachineData();
            });
            
            document.getElementById('btn-esp').classList.add('connected');
            document.getElementById('btn-esp').innerText = "Ab-Coaster OK";
        } catch(e) { console.log(e); alert("Error ESP32. Revisa consola."); }
    }

    async function connectHR() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['heart_rate'] }]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('heart_rate');
            const char = await service.getCharacteristic('heart_rate_measurement');
            await char.startNotifications();
            char.addEventListener('characteristicvaluechanged', handleHRData);
            
            document.getElementById('btn-hr').classList.add('connected');
            document.getElementById('btn-hr').innerText = "HR OK";
        } catch(e) { console.log(e); alert("Error HR"); }
    }

    // --- UI Helpers ---
    function setMode(newMode) {
        state.mode = newMode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        state.reps = 0; // Reset contador al cambiar modo
        document.getElementById('total-reps').innerText = "0";
        document.getElementById('instruction-text').innerText = "Modo Cambiado";
        document.getElementById('sub-text').innerText = "¡Empieza!";
    }

</script>
</body>
</html>
