<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbSmart Bio-Link Pro</title>
    <style>
        /* --- ESTILOS NEON / DARK MODE --- */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --primary: #00f2ff;   /* Cian */
            --success: #00ff88;   /* Verde */
            --warn: #ffcc00;      /* Amarillo */
            --danger: #ff3355;    /* Rojo */
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent-reps: #d000ff; /* Un color morado neón para destacar las Reps */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            text-align: center;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 { margin: 0 0 15px 0; font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); }

        /* --- DASHBOARD SUPERIOR (3 COLUMNAS) --- */
        .metrics-grid {
            display: grid;
            /* CAMBIO VISUAL: 3 Columnas iguales */
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #333;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .card-value { font-size: 1.8rem; font-weight: 700; line-height: 1; }
        .card-unit { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px;}

        /* Estilo especial para la tarjeta de Repeticiones */
        #card-reps .card-value { color: var(--accent-reps); font-size: 2.2rem; }
        #card-reps { border-color: #444; }

        /* --- FEEDBACK CENTRAL (El Cerebro) --- */
        .feedback-zone {
            flex-grow: 1;
            background: #000;
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        #main-msg { font-size: 1.8rem; font-weight: 800; margin: 0; text-transform: uppercase; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        #sub-msg { color: var(--text-dim); margin-top: 10px; font-size: 1rem; z-index: 2; }

        /* Barra de Progreso Dinámica */
        .progress-container {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 6px;
            margin-top: 20px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s ease-out, background 0.3s;
        }
        /* Marcador de objetivo para Hipertrofia (1 segundo) */
        .target-marker {
            position: absolute;
            left: 50%; /* Asumiendo escala de 2s, 1s es 50% */
            top: 0; bottom: 0;
            width: 2px;
            background: white;
            z-index: 5;
            display: none; 
        }

        /* --- CONTROLES INFERIORES --- */
        .controls { display: flex; flex-direction: column; gap: 15px; }

        .mode-selector {
            display: flex;
            justify-content: center;
            background: var(--card-bg);
            padding: 5px;
            border-radius: 50px;
            border: 1px solid #333;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px;
            transition: 0.3s;
            font-size: 0.8rem;
        }
        .mode-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

        .conn-row { display: flex; gap: 10px; }
        .btn-conn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-conn.connected { background: var(--success); color: #000; }
        
    </style>
</head>
<body>

    <h1>AbSmart <span style="font-size:0.5em; vertical-align: middle; opacity: 0.5;">PRO</span></h1>

    <div class="metrics-grid">
        <div class="card" id="card-reps">
            <span class="card-label">Reps</span>
            <span class="card-value" id="val-reps">0</span>
            <span class="card-unit">Total</span>
        </div>

        <div class="card" id="card-hr">
            <span class="card-label">Pulso</span>
            <span class="card-value" id="val-hr">--</span>
            <span class="card-unit">BPM</span>
        </div>
        
        <div class="card" id="card-squeeze">
            <span class="card-label">Pico</span>
            <span class="card-value" id="val-sq">0.0</span>
            <span class="card-unit">Seg</span>
        </div>
    </div>

    <div class="feedback-zone" id="feedback-zone">
        <h2 id="main-msg">CONECTA SENSORES</h2>
        <div id="sub-msg">Selecciona un modo para iniciar</div>
        
        <div class="progress-container">
            <div class="target-marker" id="target-marker"></div>
            <div class="progress-bar" id="p-bar"></div>
        </div>
    </div>

    <div class="controls">
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('HIIT')">HIIT</button>
            <button class="mode-btn" onclick="setMode('HYPER')">HIPERTROFIA</button>
            <button class="mode-btn" onclick="setMode('FLOW')">FLOW</button>
        </div>

        <div class="conn-row">
            <button class="btn-conn" id="btn-esp" onclick="connectESP()">
                <span>⚡ Máquina</span>
            </button>
            <button class="btn-conn" id="btn-hr" onclick="connectHR()">
                <span>❤️ Pulso</span>
            </button>
        </div>
        
        <div style="font-size: 0.7rem; color: #444;">v2.0 - WakeLock Active</div>
    </div>

<script>
    /* ==========================================================================
       WAKE LOCK MANAGER (Integrado según solicitud)
       ========================================================================== */
    // 1. Estado y Referencia
    let wakeLock = null;

    // Configura aquí las variables que determinan si tu app necesita pantalla encendida
    const wlState = {
      connected: false,      // Ej: Bluetooth conectado
      sessionActive: false,  // Ej: Cronómetro corriendo
      fullscreen: false      // Ej: Video o dashboard en pantalla completa
    };

    // 2. Lógica de Decisión
    function shouldHoldWakeLock() {
      // La pantalla se mantiene encendida si hay conexión bluetooth
      return wlState.connected || wlState.sessionActive || wlState.fullscreen;
    }

    // 3. Funciones Core
    async function acquireWakeLockOnce() {
      if (!('wakeLock' in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('💡 Pantalla bloqueada (Wake Lock activo)');
        
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          console.log('💤 Wake Lock liberado por sistema');
          if (document.visibilityState === 'visible' && shouldHoldWakeLock()) {
            acquireWakeLockOnce().catch(() => {});
          }
        });
      } catch (err) {
        console.warn('⚠️ No se pudo activar Wake Lock:', err);
      }
    }

    async function releaseWakeLockIfHeld() {
      if (!wakeLock) return;
      try {
        await wakeLock.release();
        console.log('💤 Wake Lock liberado manualmente');
      } catch(e) { console.error(e); }
      wakeLock = null;
    }

    async function syncWakeLock() {
      if (document.visibilityState !== 'visible') return;
      if (shouldHoldWakeLock()) {
        await acquireWakeLockOnce();
      } else {
        await releaseWakeLockIfHeld();
      }
    }

    // 4. Event Listeners Automáticos
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncWakeLock();
    });

    document.addEventListener('fullscreenchange', () => {
      wlState.fullscreen = !!document.fullscreenElement;
      syncWakeLock();
    });

    /* ==========================================================================
       LÓGICA DE LA APP
       ========================================================================== */

    // --- VARIABLES DE ESTADO ---
    let state = {
        mode: 'HIIT',       // HIIT | HYPER | FLOW
        hr: 0,              // Ritmo cardíaco actual
        lastSqueeze: 0.0,   // Segundos en pico (última repetición)
        reps: 0,            // Contador de repeticiones
        maxHR: 190,         // Ajustar según edad (220 - edad)
        connectedESP: false,
        connectedHR: false
    };

    // --- CONFIGURACIÓN BLUETOOTH ---
    const ESP_SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const ESP_CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    // --- LÓGICA CORE: EL ENTRENADOR ---
    function updateBioFeedback() {
        const msg = document.getElementById('main-msg');
        const sub = document.getElementById('sub-msg');
        const bar = document.getElementById('p-bar');
        const zone = document.getElementById('feedback-zone');
        const marker = document.getElementById('target-marker');

        const hrPercent = state.hr > 0 ? (state.hr / state.maxHR) * 100 : 0;

        // Reset
        zone.style.borderColor = "#333";
        marker.style.display = "none";

        // MODO HIIT
        if (state.mode === 'HIIT') {
            if (hrPercent < 70) {
                msg.innerText = "¡ACELERA! 🔥";
                msg.style.color = "var(--warn)";
                sub.innerText = "Sube pulsaciones";
                zone.style.borderColor = "var(--warn)";
            } else if (hrPercent > 92) {
                msg.innerText = "¡BAJA RITMO! 🛑";
                msg.style.color = "var(--danger)";
                sub.innerText = "Pulsaciones al límite";
                zone.style.borderColor = "var(--danger)";
            } else {
                msg.innerText = "¡MANTÉN RITMO! ⚡";
                msg.style.color = "var(--primary)";
                sub.innerText = "Zona Quema Grasa Óptima";
                zone.style.borderColor = "var(--primary)";
            }
            bar.style.width = hrPercent + "%";
            bar.style.background = hrPercent > 90 ? "var(--danger)" : "var(--primary)";
        }

        // MODO HIPERTROFIA
        else if (state.mode === 'HYPER') {
            marker.style.display = "block"; 

            if (hrPercent > 75) {
                msg.innerText = "RECUPERA 🛌";
                msg.style.color = "#aaa";
                sub.innerText = `Baja pulsaciones (${state.hr} bpm)`;
                bar.style.width = hrPercent + "%";
                bar.style.background = "var(--warn)";
                return; 
            }

            // Visualización del tiempo de squeeze
            let visualPercent = (state.lastSqueeze / 2.0) * 100;
            if(visualPercent > 100) visualPercent = 100;
            bar.style.width = visualPercent + "%";

            if (state.lastSqueeze < 0.2) {
                msg.innerText = "DALE FUERTE 💪";
                sub.innerText = "Sube y sostén arriba";
            } else if (state.lastSqueeze < 0.8) {
                msg.innerText = "¡MUY RÁPIDO! 🐢";
                msg.style.color = "var(--danger)";
                sub.innerText = "Sostén al menos 1 segundo";
                bar.style.background = "var(--danger)";
                zone.style.borderColor = "var(--danger)";
            } else {
                msg.innerText = "¡EXCELENTE! ⭐";
                msg.style.color = "var(--success)";
                sub.innerText = "Buena tensión mecánica";
                bar.style.background = "var(--success)";
                zone.style.borderColor = "var(--success)";
            }
        }

        // MODO FLOW
        else if (state.mode === 'FLOW') {
            const minZone = 70;
            const maxZone = 80;

            if (hrPercent < minZone) {
                msg.innerText = "SUBE INTENSIDAD 🔼";
                sub.innerText = "Objetivo: Zona Cardio";
                zone.style.borderColor = "var(--primary)";
            } else if (hrPercent > maxZone) {
                msg.innerText = "BAJA INTENSIDAD 🔽";
                sub.innerText = "Controla la respiración";
                zone.style.borderColor = "var(--warn)";
            } else {
                msg.innerText = "🌊 EN FLUJO 🌊";
                msg.style.color = "var(--success)";
                sub.innerText = "Ritmo perfecto";
                zone.style.borderColor = "var(--success)";
            }
            bar.style.width = hrPercent + "%";
            bar.style.background = (hrPercent >= minZone && hrPercent <= maxZone) ? "var(--success)" : "#555";
        }
    }

    // --- CONEXIÓN BLUETOOTH: MÁQUINA ---
    async function connectESP() {
        const btn = document.getElementById('btn-esp');
        try {
            btn.innerText = "⏳ Buscando...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'Ab' }],
                optionalServices: [ESP_SERVICE_UUID]
            });
            
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(ESP_SERVICE_UUID);
            const char = await service.getCharacteristic(ESP_CHAR_UUID);
            
            await char.startNotifications();
            char.addEventListener('characteristicvaluechanged', handleMachineData);

            state.connectedESP = true;
            // ACTIVAR WAKE LOCK AL CONECTAR
            wlState.connected = true; 
            syncWakeLock();

            btn.classList.add('connected');
            btn.innerHTML = "<span>⚡ Conectado</span>";
            document.getElementById('sub-msg').innerText = "Máquina lista. ¡Empieza!";

        } catch (error) {
            console.error(error);
            alert("Error conectando: " + error);
            btn.innerText = "⚡ Reintentar";
        }
    }

    // --- LÓGICA DE FILTRADO DE DATOS (Corrección de Inversión) ---
    function handleMachineData(event) {
        const dataView = event.target.value;
        const seconds = dataView.getFloat32(0, true);
        
        // --- FILTRO DE SEGURIDAD PARA INVERSIÓN ---
        // Si el tiempo es mayor a 3 segundos, asumimos que es un DESCANSO 
        // (el imán se quedó pegado o lejos mucho tiempo) y NO es una repetición de fuerza.
        if (seconds > 3.0) {
            console.log("Ignorado: Tiempo demasiado largo (" + seconds + "s) considerado descanso.");
            return; // Salimos de la función sin contar la repetición
        }

        // Si pasa el filtro, es una repetición válida (< 3s)
        state.lastSqueeze = seconds;
        state.reps++;

        // Actualizar UI
        document.getElementById('val-sq').innerText = seconds.toFixed(2);
        document.getElementById('val-reps').innerText = state.reps;

        // Feedback visual en la tarjeta
        const cardSq = document.getElementById('card-squeeze');
        cardSq.style.borderColor = "var(--primary)";
        setTimeout(() => cardSq.style.borderColor = "#333", 500);

        updateBioFeedback();
    }

    // --- CONEXIÓN BLUETOOTH: HEART RATE ---
    async function connectHR() {
        const btn = document.getElementById('btn-hr');
        try {
            btn.innerText = "⏳ Buscando...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['heart_rate'] }]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('heart_rate');
            const char = await service.getCharacteristic('heart_rate_measurement');
            
            await char.startNotifications();
            char.addEventListener('characteristicvaluechanged', handleHRData);

            state.connectedHR = true;
            // ACTIVAR WAKE LOCK TAMBIÉN AQUÍ
            wlState.connected = true; 
            syncWakeLock();

            btn.classList.add('connected');
            btn.innerHTML = "<span>❤️ Conectado</span>";

        } catch (error) {
            console.error(error);
            btn.innerText = "❤️ Reintentar";
        }
    }

    function handleHRData(event) {
        const value = event.target.value;
        const hr = value.getUint8(1);
        state.hr = hr;
        document.getElementById('val-hr').innerText = hr;
        updateBioFeedback();
    }

    // --- UTILIDADES UI ---
    function setMode(newMode) {
        state.mode = newMode;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.includes(newMode) || (newMode === 'HYPER' && btn.innerText.includes('HIPER'))) {
                btn.classList.add('active');
            }
        });
        document.getElementById('main-msg').innerText = newMode + " ACTIVO";
        document.getElementById('sub-msg').innerText = "Haz una repetición para calibrar";
        
        // Resetear contador al cambiar de modo (opcional)
        state.reps = 0;
        document.getElementById('val-reps').innerText = "0";
        updateBioFeedback();
    }
</script>

</body>
</html>
