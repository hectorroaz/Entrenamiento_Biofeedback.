<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbSmart Bio-Link v2</title>
    <style>
        /* --- ESTILOS VISUALES --- */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --primary: #00f2ff;
            --success: #00ff88;
            --warn: #ffcc00;
            --danger: #ff3355;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        h1 { margin: 0 0 15px 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); opacity: 0.8; }

        /* --- DASHBOARD DE 3 COLUMNAS --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* Tres columnas iguales */
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
