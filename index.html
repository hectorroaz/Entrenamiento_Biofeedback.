<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbSmart Science</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --text: #ffffff;
            --z1: #3b82f6; /* Azul - Calentamiento */
            --z2: #22c55e; /* Verde - Quema Grasa */
            --z3: #eab308; /* Amarillo - Aeróbico */
            --z4: #f97316; /* Naranja - Anaeróbico */
            --z5: #ef4444; /* Rojo - Extremo */
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; text-align: center; }
        
        /* HEADER & CONFIG */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .age-config { font-size: 0.8rem; background: #333; padding: 5px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
        input[type=number] { width: 40px; background: transparent; border: none; color: white; font-weight: bold; text-align: center; font-size: 1rem; border-bottom: 1px solid #555; }

        /* INDICADOR DE ESTADO (Esquina Superior) */
        .status-pill {
            font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase;
            background: #333; color: #777; transition: 0.2s;
        }
        .status-pill.up { background: var(--text); color: black; box-shadow: 0 0 10px white; }

        /* GAUGE VISUAL (Canvas) */
        .gauge-container { position: relative; width: 280px; height: 140px; margin: 0 auto 10px auto; }
        canvas#gaugeCanvas { width: 100%; height: 100%; }
        .gauge-data { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; }
        .bpm-big { font-size: 3.5rem; font-weight: 800; line-height: 1; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .zone-label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-top: 5px; }

        /* DASHBOARD METRICS */
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 10px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; }
        .lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .val { font-size: 1.5rem; font-weight: 700; }
        .timer-val { font-family: monospace; letter-spacing: -1px; color: var(--z3); }

        /* FEEDBACK TEXT */
        .feedback-box { background: #111; border-radius: 15px; padding: 15px; margin-bottom: 15px; border-left: 4px solid #555; text-align: left; min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
        #fb-main { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
        #fb-sub { font-size: 0.85rem; color: #aaa; }

        /* CONTROLS */
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; background: #333; color: #fff; }
        .btn.active { background: white; color: black; }
        
        .action-row { display: flex; gap: 10px; margin-top: auto; }
        .btn-conn { flex: 2; background: var(--z1); color: white; padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; }
        .btn-end { flex: 1; background: var(--z5); color: white; padding: 15px; border: none; border-radius: 12px; font-weight: bold; }

    </style>
</head>
<body>

    <div class="header">
        <div class="age-config">
            Edad: <input type="number" id="userAge" value="30" onchange="calculateZones()">
        </div>
        <div id="statusIndicator" class="status-pill">Abajo</div>
    </div>

    <div class="gauge-container">
        <canvas id="gaugeCanvas"></canvas>
        <div class="gauge-data">
            <div class="bpm-big" id="hrValue">--</div>
            <div class="zone-label" id="zoneLabel" style="color: #666;">Desconectado</div>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="card">
            <span class="lbl">Repeticiones</span>
            <span class="val" id="repValue" style="color:white">0</span>
        </div>
        <div class="card">
            <span class="lbl">Tiempo Sesión</span>
            <span class="val timer-val" id="timerValue">00:00</span>
        </div>
        <div class="card">
            <span class="lbl">Último Pico</span>
            <span class="val" id="squeezeValue">0.0s</span>
        </div>
    </div>

    <div class="feedback-box" id="feedbackBox">
        <div id="fb-main">Esperando conexión...</div>
        <div id="fb-sub">Conecta los sensores para iniciar el entrenamiento científico.</div>
    </div>

    <div class="btn-group">
        <button class="btn active" onclick="setMode('HIIT')">HIIT</button>
        <button class="btn" onclick="setMode('HYPER')">HIPERTROFIA</button>
        <button class="btn" onclick="setMode('FLOW')">FLOW</button>
    </div>

    <div class="action-row">
        <button class="btn-conn" onclick="connectAll()">⚡ CONECTAR TODO</button>
        <button class="btn-end" onclick="endSession()">🏁 FIN</button>
    </div>

<script>
    // --- ESTADO GLOBAL Y REGISTRO ---
    let state = {
        age: 30, maxHR: 190, hr: 0, reps: 0, lastSqueeze: 0, 
        mode: 'HIIT', isUp: false,
        sessionActive: false, startTime: 0, totalPauseTime: 0, lastPauseStart: 0,
        lastActivityTime: 0
    };

    // Historial para exportar
    let sessionLog = []; // { time: '00:01', hr: 120, event: 'rep', val: 1.2 }

    // Zonas de color
    const Z_COLORS = ["#3b82f6", "#22c55e", "#eab308", "#f97316", "#ef4444"];
    
    // --- INICIALIZACIÓN ---
    calculateZones();
    drawGauge(0);
    setInterval(sessionTick, 1000); // Cronómetro

    function calculateZones() {
        state.age = document.getElementById('userAge').value;
        state.maxHR = 220 - state.age;
        console.log("Max HR Recalculado:", state.maxHR);
    }

    // --- LOGICA DE CRONÓMETRO Y AUTO-PAUSA ---
    function sessionTick() {
        if (!state.sessionActive) return;

        // Auto-Pausa tras 30s de inactividad
        if (Date.now() - state.lastActivityTime > 30000) {
            pauseSession();
            return;
        }

        const elapsed = Date.now() - state.startTime - state.totalPauseTime;
        const totalSecs = Math.floor(elapsed / 1000);
        const m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
        const s = (totalSecs % 60).toString().padStart(2, '0');
        document.getElementById('timerValue').innerText = `${m}:${s}`;
        
        // Loguear datos cada segundo si hay HR
        if (state.hr > 0) {
            sessionLog.push({ t: totalSecs, hr: state.hr, type: 'status' });
        }
    }

    function startSession() {
        if (!state.sessionActive) {
            if (state.startTime === 0) {
                // Primer inicio
                state.startTime = Date.now();
                state.lastActivityTime = Date.now();
                sessionLog = []; // Reset log
                console.log("Sesión Iniciada");
            } else {
                // Reanudar
                const pausedDuration = Date.now() - state.lastPauseStart;
                state.totalPauseTime += pausedDuration;
                console.log("Sesión Reanudada");
            }
            state.sessionActive = true;
            document.getElementById('timerValue').style.opacity = "1";
        }
        state.lastActivityTime = Date.now(); // Reset timeout
    }

    function pauseSession() {
        if (state.sessionActive) {
            state.sessionActive = false;
            state.lastPauseStart = Date.now();
            document.getElementById('timerValue').style.opacity = "0.5";
            updateFeedback("EN PAUSA", "Mueve la máquina para reanudar");
        }
    }

    // --- BLUETOOTH (Simplificado para conectar ambos) ---
    async function connectAll() {
        try {
            // 1. ESP32
            const device1 = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'Ab' }], optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b'] });
            const server1 = await device1.gatt.connect();
            const service1 = await server1.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
            const char1 = await service1.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
            await char1.startNotifications();
            char1.addEventListener('characteristicvaluechanged', handleESPData);
            
            // 2. HR Monitor (Si el usuario lo selecciona en la segunda ventana del navegador)
            // Nota: El navegador suele pedir permisos uno por uno.
            alert("Ahora selecciona tu banda cardíaca / reloj.");
            const device2 = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
            const server2 = await device2.gatt.connect();
            const service2 = await server2.getPrimaryService('heart_rate');
            const char2 = await service2.getCharacteristic('heart_rate_measurement');
            await char2.startNotifications();
            char2.addEventListener('characteristicvaluechanged', handleHRData);

            document.querySelector('.btn-conn').innerText = "✅ CONECTADO";
            document.querySelector('.btn-conn').style.background = "#22c55e";
            wakeLockOn(); // Mantener pantalla encendida

        } catch (e) {
            console.error(e);
            alert("Conexión incompleta o cancelada. Intenta de nuevo.");
        }
    }

    // --- PROCESAMIENTO DE DATOS ---
    function handleESPData(e) {
        const val = e.target.value.getFloat32(0, true);
        
        startSession(); // Cualquier movimiento activa la sesión

        // 0.0 significa que el imán se activó (ARRIBA)
        if (val === 0.0) {
            state.isUp = true;
            document.getElementById('statusIndicator').innerText = "💪 ARRIBA";
            document.getElementById('statusIndicator').classList.add('up');
        } 
        // Valor > 0 es el tiempo final (BAJADA/Rep completa)
        else if (val > 0) {
            state.isUp = false;
            document.getElementById('statusIndicator').innerText = "ABAJO";
            document.getElementById('statusIndicator').classList.remove('up');
            
            // Validar repetición según lógica
            processRep(val);
        }
    }

    function handleHRData(e) {
        const val = e.target.value.getUint8(1);
        state.hr = val;
        
        // Calcular Zona (1-5)
        const pct = (state.hr / state.maxHR);
        let zoneIdx = 0;
        if (pct >= 0.9) zoneIdx = 4;
        else if (pct >= 0.8) zoneIdx = 3;
        else if (pct >= 0.7) zoneIdx = 2;
        else if (pct >= 0.6) zoneIdx = 1;
        
        // Actualizar UI
        document.getElementById('hrValue').innerText = val;
        document.getElementById('hrValue').style.color = Z_COLORS[zoneIdx];
        document.getElementById('zoneLabel').innerText = `Zona ${zoneIdx + 1} (${Math.round(pct*100)}%)`;
        document.getElementById('zoneLabel').style.color = Z_COLORS[zoneIdx];
        
        drawGauge(pct);
        updateBioFeedback(); // Chequear lógica científica
    }

    function processRep(duration) {
        state.reps++;
        state.lastSqueeze = duration;
        document.getElementById('repValue').innerText = state.reps;
        document.getElementById('squeezeValue').innerText = duration.toFixed(1) + "s";
        
        // Guardar para el reporte
        const elapsed = Math.floor((Date.now() - state.startTime - state.totalPauseTime) / 1000);
        sessionLog.push({ t: elapsed, type: 'rep', val: duration });

        updateBioFeedback();
    }

    // --- EL CEREBRO DE ENTRENAMIENTO (LOGICA ACTUALIZADA) ---
    function updateBioFeedback() {
        const fbMain = document.getElementById('fb-main');
        const fbSub = document.getElementById('fb-sub');
        const box = document.getElementById('feedbackBox');
        
        const pct = state.hr / state.maxHR;

        if (state.mode === 'HIIT') {
            if (pct < 0.7) { 
                updateFeedback("¡ACELERA!", "Sube pulsaciones a Zona Naranja/Roja", "#eab308");
            } else if (pct > 0.92) {
                updateFeedback("ALTO RIESGO", "Baja un poco el ritmo, estás al límite", "#ef4444");
            } else {
                updateFeedback("RITMO PERFECTO", "Mantén esta intensidad quemagrasa", "#22c55e");
            }
        } 
        else if (state.mode === 'HYPER') {
            // Lógica Rest-Pause
            if (pct > 0.75) {
                updateFeedback("DESCANSANDO...", `Espera a bajar a Zona Azul (<${Math.round(state.maxHR*0.6)} bpm)`, "#3b82f6");
            } else {
                if (state.lastSqueeze < 1.0 && state.reps > 0) {
                    updateFeedback("SUBIDA RÁPIDA", "Sostén al menos 1 segundo arriba para hipertrofia", "#f97316");
                } else {
                    updateFeedback("MODO FUERZA", "Ejecuta lento y controlado", "#22c55e");
                }
            }
        }
        else if (state.mode === 'FLOW') {
            if (pct < 0.6) updateFeedback("SUBE INTENSIDAD", "Entra en zona aeróbica", "#3b82f6");
            else if (pct > 0.8) updateFeedback("BAJA INTENSIDAD", "Estás saliendo de la zona de flujo", "#f97316");
            else updateFeedback("FLOW STATE 🌊", "Respiración y movimiento sincronizados", "#22c55e");
        }
    }

    function updateFeedback(main, sub, color) {
        const box = document.getElementById('feedbackBox');
        document.getElementById('fb-main').innerText = main;
        document.getElementById('fb-sub').innerText = sub;
        box.style.borderLeftColor = color;
        document.getElementById('fb-main').style.color = color;
    }

    function setMode(m) {
        state.mode = m;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        state.reps = 0; // Reset visual reps (opcional)
        document.getElementById('repValue').innerText = "0";
        updateFeedback("MODO " + m, "Comienza para calibrar sensor", "#fff");
    }

    // --- CANVAS GAUGE (GRAFICO SEMICIRCULO) ---
    function drawGauge(pct) {
        const cvs = document.getElementById('gaugeCanvas');
        const ctx = cvs.getContext('2d');
        const W = cvs.width = 300; 
        const H = cvs.height = 150;
        
        ctx.clearRect(0,0,W,H);
        
        // Fondo Gris
        ctx.beginPath();
        ctx.arc(W/2, H, 130, Math.PI, 0);
        ctx.lineWidth = 20;
        ctx.strokeStyle = "#333";
        ctx.stroke();

        // Zonas de Color
        if (pct > 1) pct = 1;
        const endAngle = Math.PI + (Math.PI * pct);
        
        // Gradiente dinámico según intensidad
        let color = Z_COLORS[0];
        if(pct > 0.6) color = Z_COLORS[1];
        if(pct > 0.7) color = Z_COLORS[2];
        if(pct > 0.8) color = Z_COLORS[3];
        if(pct > 0.9) color = Z_COLORS[4];

        ctx.beginPath();
        ctx.arc(W/2, H, 130, Math.PI, endAngle);
        ctx.strokeStyle = color;
        ctx.stroke();

        // Icono de pesa (Visual extra)
        ctx.font = "30px Arial";
        ctx.fillStyle = "white";
        ctx.fillText("🏋️", W/2 - 15, H - 40);
    }

    // --- WAKE LOCK ---
    async function wakeLockOn() {
        try { await navigator.wakeLock.request('screen'); } catch(e){}
    }

    // --- EXPORTAR REPORTE HTML ---
    function endSession() {
        if(!confirm("¿Finalizar sesión y descargar reporte?")) return;
        
        // Crear Reporte
        const date = new Date().toLocaleString();
        const avgHR = Math.round(sessionLog.filter(d => d.type === 'status').reduce((a,b)=>a+b.hr,0) / (sessionLog.length||1));
        const htmlContent = `
        <html>
        <head><title>Reporte AbSmart</title>
        <style>body{font-family:sans-serif;padding:20px;background:#f0f2f5} .box{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 5px rgba(0,0,0,0.1)} h1{color:#333}</style>
        </head>
        <body>
            <h1>Reporte de Entrenamiento AbSmart</h1>
            <div class="box">
                <p><strong>Fecha:</strong> ${date}</p>
                <p><strong>Modo:</strong> ${state.mode}</p>
                <p><strong>Reps Totales:</strong> ${state.reps}</p>
                <p><strong>Pulso Promedio:</strong> ${avgHR} bpm</p>
                <p><strong>Duración:</strong> ${document.getElementById('timerValue').innerText}</p>
            </div>
            <div class="box">
                <canvas id="chart"></canvas>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>
            <script>
                const data = ${JSON.stringify(sessionLog)};
                const labels = data.map(d => d.t + 's');
                const hrs = data.map(d => d.hr > 0 ? d.hr : null);
                const reps = data.map(d => d.type === 'rep' ? d.val * 10 : null); // Escalar rep para ver en grafico

                new Chart(document.getElementById('chart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Frecuencia Cardíaca', data: hrs, borderColor: 'red', tension: 0.4 },
                            { label: 'Repeticiones (Escalada)', data: reps, type: 'bar', backgroundColor: 'blue' }
                        ]
                    }
                });
            <\/script>
        </body></html>`;

        const blob = new Blob([htmlContent], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `AbSmart_Reporte_${Date.now()}.html`;
        link.click();
    }
</script>
</body>
</html>
