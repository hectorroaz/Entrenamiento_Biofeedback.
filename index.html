<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbSmart Science v4.4 (Modo TUT)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --text: #ffffff;
            --z0: #6b7280; /* Gris */
            --z1: #3b82f6; /* Azul */
            --z2: #22c55e; /* Verde */
            --z3: #eab308; /* Amarillo */
            --z4: #f97316; /* Naranja */
            --z5: #ef4444; /* Rojo */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        
        /* HEADER */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            gap: 5px;
        }
        .config-box {
            font-size: 0.8rem;
            background: #333;
            padding: 5px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-grow: 1;
            justify-content: center;
            height: 32px;
        }
        input[type=number] {
            width: 30px;
            background: transparent;
            border: none;
            color: var(--z2);
            font-weight: bold;
            text-align: center;
            font-size: 0.9rem;
            border-bottom: 1px solid #555;
        }
        select.zone-selector {
            background: transparent;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 0.75rem;
            text-align: center;
            width: 100%;
            outline: none;
        }
        option { background: #333; color: white; }

        .btn-icon {
            background: #333;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* FEEDBACK (Arriba) */
        .feedback-box {
            background: #111;
            border-radius: 15px;
            padding: 8px;
            margin: 5px 0 5px 0;
            border: 2px solid #333;
            text-align: center;
            min-height: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s;
        }
        #fb-main {
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #fb-sub {
            font-size: 0.8rem;
            color: #aaa;
        }

        /* FILA ESTADO ARRIBA/ABAJO */
        .status-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        /* INDICADOR ARRIBA/ABAJO */
        .status-pill {
            min-width: 130px;
            margin: 0;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 0 12px;
            height: 32px;
            display: flex;
            align-items: center;
            border-radius: 6px;
            text-transform: uppercase;
            background: #222;
            color: #999;
            transition: 0.2s;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #444;
        }
        .status-pill.up {
            background: white;
            color: black;
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        /* GAUGE */
        .gauge-container {
            position: relative;
            width: 280px;
            height: 140px;
            margin: 0 auto 10px auto;
        }
        canvas#gaugeCanvas { width: 100%; height: 100%; }
        .gauge-data {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
        }
        .bpm-big {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .zone-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 5px;
        }

        /* METRICAS: 4 columnas en una sola fila */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lbl {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }
        .val {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .timer-val {
            font-family: monospace;
            letter-spacing: -1px;
            color: var(--z3);
        }

        /* CONEXIONES */
        .conn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-conn {
            flex: 1;
            background: #333;
            color: white;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-conn.connected { display: none; }

        /* BOTONES MODOS */
        .btn-group {
            display: flex;
            gap: 6px; /* Reducido ligeramente para acomodar 4 botones */
            margin-bottom: 10px;
            overflow-x: auto; /* Por si en pantallas muy pequeñas se salen */
        }
        .btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: #333;
            color: #aaa;
            font-size: 0.75rem; /* Ajuste leve para que quepan todos */
            white-space: nowrap;
        }
        .btn.active {
            background: white;
            color: black;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        /* FIN */
        .btn-end {
            width: 100%;
            background: var(--z5);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            margin-top: auto;
        }

    </style>
</head>
<body>

    <div class="header-row">
        <button class="btn-icon" onclick="toggleFullscreen()">⛶</button>
        
        <div class="config-box">
            Edad: <input type="number" id="userAge" value="33" onchange="calculateZones()">
        </div>
        
        <div class="config-box">
            🎯 <select id="targetZoneSelect" class="zone-selector" onchange="updateBioFeedback()">
                <option value="auto">Auto</option>
                <option value="1">Zona 1</option>
                <option value="2">Zona 2</option>
                <option value="3">Zona 3</option>
                <option value="4">Zona 4</option>
                <option value="5">Zona 5</option>
            </select>
        </div>
    </div>

    <!-- FEEDBACK -->
    <div class="feedback-box" id="feedbackBox">
        <div id="fb-main">LISTO</div>
        <div id="fb-sub">Selecciona modo o conecta sensores</div>
    </div>
    
    <!-- INDICADOR ARRIBA/ABAJO -->
    <div class="status-row">
        <div id="statusIndicator" class="status-pill" onclick="toggleStatusManual()">ABAJO</div>
    </div>

    <div class="gauge-container">
        <canvas id="gaugeCanvas"></canvas>
        <div class="gauge-data">
            <div class="bpm-big" id="hrValue">--</div>
            <div class="zone-label" id="zoneLabel" style="color: #666;">Desconectado</div>
        </div>
    </div>

    <div class="conn-row" id="connectionRow">
        <button class="btn-conn" id="btn-esp" onclick="connectMachine()">🔌 MÁQUINA</button>
        <button class="btn-conn" id="btn-hr" onclick="connectHR()">❤️ CARDIO</button>
    </div>

    <!-- 4 TARJETAS -->
    <div class="metrics-grid">
        <div class="card">
            <span class="lbl">Repeticiones</span>
            <span class="val" id="repValue" style="color:white">0</span>
        </div>
        <div class="card">
            <span class="lbl">Tiempo Sesión</span>
            <span class="val timer-val" id="timerValue">00:00</span>
        </div>
        <div class="card">
            <span class="lbl">Squeeze (seg)</span>
            <span class="val" id="squeezeValue">0.0</span>
        </div>
        <div class="card">
            <span class="lbl">Reps/min</span>
            <span class="val" id="repRateValue" style="color:white">0.0</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn active" onclick="setMode('HIIT')">HIIT</button>
        <button class="btn" onclick="setMode('HYPER')">HIPER</button>
        <button class="btn" onclick="setMode('FLOW')">FLOW</button>
        <!-- NUEVO MODO TUT -->
        <button class="btn" onclick="setMode('TUT')">TUT</button>
    </div>

    <button class="btn-end" onclick="endSession()">🏁 FINALIZAR Y EXPORTAR REPORTE</button>

<script>
    /* ========================================================================
       WAKE LOCK MANAGER
       ======================================================================== */
    let wakeLock = null;
    function shouldHoldWakeLock() { return true; }
    async function acquireWakeLockOnce() {
      if (!('wakeLock' in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          if (document.visibilityState === 'visible') acquireWakeLockOnce();
        });
      } catch (err) { console.warn('⚠️ Wake Lock Error:', err); }
    }
    document.addEventListener('click', acquireWakeLockOnce, {once:true});
    document.addEventListener('visibilitychange', () => { 
        if (document.visibilityState === 'visible') acquireWakeLockOnce(); 
    });

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }


    /* ========================================================================
       LÓGICA PRINCIPAL APP
       ======================================================================== */

    let state = {
        age: 33,
        maxHR: 187,
        hr: 0,
        reps: 0,
        lastSqueeze: 0,
        mode: 'HIIT',
        isUp: false,
        sessionActive: false,
        startTime: 0,
        totalPauseTime: 0,
        lastPauseStart: 0,
        lastActivityTime: 0
    };

    let sessionLog = [];
    const Z_COLORS = ["#6b7280", "#3b82f6", "#22c55e", "#eab308", "#f97316", "#ef4444"];
    
    // Init
    calculateZones();
    drawGauge(0);
    setInterval(sessionTick, 1000); 

    function calculateZones() {
        state.age = document.getElementById('userAge').value;
        state.maxHR = 220 - state.age;
        
        const sel = document.getElementById('targetZoneSelect');
        const ranges = [
            {l: 'Zona 1', min: 0.5, max: 0.6},
            {l: 'Zona 2', min: 0.6, max: 0.7},
            {l: 'Zona 3', min: 0.7, max: 0.8},
            {l: 'Zona 4', min: 0.8, max: 0.9},
            {l: 'Zona 5', min: 0.9, max: 1.0}
        ];
        
        for(let i=0; i<ranges.length; i++){
            const minBPM = Math.round(state.maxHR * ranges[i].min);
            const maxBPM = Math.round(state.maxHR * ranges[i].max);
            sel.options[i+1].text = `${ranges[i].l} (${minBPM}-${maxBPM})`;
        }

        updateBioFeedback(); 
    }

    function sessionTick() {
        if (!state.sessionActive) return;

        // Auto-Pausa: 60s inactividad
        if (Date.now() - state.lastActivityTime > 60000) {
            pauseSession();
            return;
        }

        const elapsed = Date.now() - state.startTime - state.totalPauseTime;
        const totalSecs = Math.floor(elapsed / 1000);

        const m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
        const s = (totalSecs % 60).toString().padStart(2, '0');
        document.getElementById('timerValue').innerText = `${m}:${s}`;
        
        // Reps/min
        const repRateEl = document.getElementById('repRateValue');
        if (totalSecs > 0) {
            const rpm = (state.reps * 60) / totalSecs;
            repRateEl.innerText = rpm.toFixed(1);
        } else {
            repRateEl.innerText = "0.0";
        }

        if (state.hr > 0) {
            sessionLog.push({ t: totalSecs, hr: state.hr, type: 'status' });
        }
    }

    function startSession() {
        state.lastActivityTime = Date.now();
        if (!state.sessionActive) {
            if (state.startTime === 0) {
                state.startTime = Date.now();
                sessionLog = [];
            } else {
                state.totalPauseTime += (Date.now() - state.lastPauseStart);
            }
            state.sessionActive = true;
            document.getElementById('timerValue').style.opacity = "1";
        }
    }

    function pauseSession() {
        if (state.sessionActive) {
            state.sessionActive = false;
            state.lastPauseStart = Date.now();
            document.getElementById('timerValue').style.opacity = "0.5";
            updateFeedback("EN PAUSA", "Mueve la máquina para reanudar", "#888");
        }
    }

    function checkConnections() {
        const btnEsp = document.getElementById('btn-esp');
        const btnHr = document.getElementById('btn-hr');
        const row = document.getElementById('connectionRow');

        if (btnEsp.classList.contains('connected')) btnEsp.style.display = 'none';
        if (btnHr.classList.contains('connected')) btnHr.style.display = 'none';

        if (btnEsp.style.display === 'none' && btnHr.style.display === 'none') {
            row.style.display = 'none';
        }
    }

    /* ------------------------------------------------------------------------
       CONTROL DE ESTADO ARRIBA/ABAJO
       ------------------------------------------------------------------------ */
    function setStatus(isUp) {
        state.isUp = isUp;
        const pill = document.getElementById('statusIndicator');
        if (isUp) {
            pill.innerText = "ARRIBA";
            pill.classList.add('up');
        } else {
            pill.innerText = "ABAJO";
            pill.classList.remove('up');
        }
    }

    // Permite al usuario corregir manualmente cuando falle el sensor
    function toggleStatusManual() {
        setStatus(!state.isUp);
    }

    // 1. MAQUINA
    async function connectMachine() {
        const btn = document.getElementById('btn-esp');
        try {
            btn.innerText = "⏳ ...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'Ab' }],
                optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
            const char = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
            await char.startNotifications();
            char.addEventListener('characteristicvaluechanged', handleESPData);
            
            btn.classList.add('connected');
            checkConnections();
            acquireWakeLockOnce(); 

        } catch (e) {
            console.error(e);
            btn.innerText = "🔌 Reintentar";
        }
    }

    // 2. CARDIO
    async function connectHR() {
        const btn = document.getElementById('btn-hr');
        try {
            btn.innerText = "⏳ ...";
            const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('heart_rate');
            const char = await service.getCharacteristic('heart_rate_measurement');
            await char.startNotifications();
            char.addEventListener('characteristicvaluechanged', handleHRData);
            
            btn.classList.add('connected');
            checkConnections();
            acquireWakeLockOnce();

        } catch (e) {
            console.error(e);
            btn.innerText = "❤️ Reintentar";
        }
    }

    function handleESPData(e) {
        const val = e.target.value.getFloat32(0, true);
        startSession(); 

        if (val === 0.0) {
            // Fase ARRIBA
            setStatus(true);
        } else if (val > 0) {
            // Fase ABAJO + conteo de repetición
            setStatus(false);
            
            state.reps++;
            state.lastSqueeze = val;
            document.getElementById('repValue').innerText = state.reps;
            document.getElementById('squeezeValue').innerText = val.toFixed(1);
            
            const elapsed = Math.floor((Date.now() - state.startTime - state.totalPauseTime) / 1000);
            sessionLog.push({ t: elapsed, type: 'rep', val: val });
            updateBioFeedback();
        }
    }

    function handleHRData(e) {
        const val = e.target.value.getUint8(1);
        state.hr = val;
        
        const minGauge = 40; 
        let range = state.maxHR - minGauge;
        let visualPct = (state.hr - minGauge) / range;
        if (visualPct < 0) visualPct = 0;

        const absolutePct = state.hr / state.maxHR;
        let zoneIdx = 0; 
        let zoneText = "Reposo";

        if (absolutePct < 0.50) { zoneIdx = 0; zoneText = "Calentamiento"; }
        else if (absolutePct < 0.60) { zoneIdx = 1; zoneText = "Zona 1"; }
        else if (absolutePct < 0.70) { zoneIdx = 2; zoneText = "Zona 2"; }
        else if (absolutePct < 0.80) { zoneIdx = 3; zoneText = "Zona 3"; }
        else if (absolutePct < 0.90) { zoneIdx = 4; zoneText = "Zona 4"; }
        else { zoneIdx = 5; zoneText = "Zona 5"; }
        
        const currentColor = Z_COLORS[zoneIdx];

        document.getElementById('hrValue').innerText = val;
        document.getElementById('hrValue').style.color = currentColor;
        document.getElementById('zoneLabel').innerText = `${zoneText} (${Math.round(absolutePct*100)}%)`;
        document.getElementById('zoneLabel').style.color = currentColor;
        
        drawGauge(visualPct, currentColor);
        updateBioFeedback(absolutePct);
    }

    function updateBioFeedback(pct) {
        if(!pct) pct = state.hr / state.maxHR;
        const targetSelection = document.getElementById('targetZoneSelect').value;

        // MANUAL (Override de modos automáticos si el usuario selecciona una zona específica)
        if (targetSelection !== 'auto') {
            const targetZoneIdx = parseInt(targetSelection); 
            const minPct = 0.5 + ((targetZoneIdx - 1) * 0.1); 
            const maxPct = minPct + 0.1;

            if (pct < minPct) {
                updateFeedback("SUBE RITMO 🔼", `Meta: Zona ${targetSelection}`, Z_COLORS[targetZoneIdx]);
            } else if (pct > maxPct) {
                updateFeedback("BAJA RITMO 🔽", `Sobre Zona ${targetSelection}`, Z_COLORS[targetZoneIdx]);
            } else {
                updateFeedback("¡EN ZONA! 🎯", `Manteniendo Zona ${targetSelection}`, "#fff");
            }
            return;
        }

        // --- MODOS AUTOMÁTICOS ---

        // 1. HIIT
        if (state.mode === 'HIIT') {
            if (pct < 0.7) updateFeedback("¡ACELERA!", "Busca Zona Naranja", Z_COLORS[3]);
            else if (pct > 0.92) updateFeedback("ALTO RIESGO", "Baja un poco", Z_COLORS[5]);
            else updateFeedback("RITMO HIIT 🔥", "Intensidad ideal", Z_COLORS[2]);
        } 
        // 2. HIPERTROFIA
        else if (state.mode === 'HYPER') {
            if (pct > 0.75) updateFeedback("RECUPERA...", `Baja pulsaciones`, Z_COLORS[1]);
            else {
                if (state.lastSqueeze < 1.0 && state.reps > 0) updateFeedback("SUBIDA RÁPIDA", "Sostén 1 seg arriba", Z_COLORS[4]);
                else updateFeedback("MODO FUERZA 💪", "Control total", Z_COLORS[2]);
            }
        }
        // 3. FLOW
        else if (state.mode === 'FLOW') {
            if (pct < 0.6) updateFeedback("SUBE INTENSIDAD", "Entra en flow", Z_COLORS[1]);
            else if (pct > 0.8) updateFeedback("BAJA INTENSIDAD", "Demasiado intenso", Z_COLORS[4]);
            else updateFeedback("FLOW STATE 🌊", "Perfecto", Z_COLORS[2]);
        }
        // 4. TUT (Tiempo Bajo Tensión) - NUEVO
        else if (state.mode === 'TUT') {
            // Regla de seguridad prioritaria
            if (pct > 0.85) {
                updateFeedback("RECUPERA", "La FC está muy alta, respira", Z_COLORS[5]);
            } else {
                // Coach de técnica basado en lastSqueeze
                if (state.reps === 0) {
                     updateFeedback("MODO TUT", "Realiza la primera repetición", "#fff");
                }
                else if (state.lastSqueeze < 0.9) {
                    updateFeedback("DEMASIADO RÁPIDO", "Sostén al menos 0.9s", Z_COLORS[4]); // Naranja
                } 
                else if (state.lastSqueeze > 2.5) {
                    updateFeedback("MUY LENTO", "No te quedes tanto arriba", Z_COLORS[3]); // Amarillo
                } 
                else {
                    updateFeedback("TENSIÓN PERFECTA", "Control ideal", Z_COLORS[2]); // Verde
                }
            }
        }
    }

    function updateFeedback(main, sub, color) {
        const box = document.getElementById('feedbackBox');
        document.getElementById('fb-main').innerText = main;
        document.getElementById('fb-sub').innerText = sub;
        box.style.borderColor = color;
        document.getElementById('fb-main').style.color = color;
    }

    function setMode(m) {
        state.mode = m;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        updateBioFeedback();
    }

    function drawGauge(pct, overrideColor) {
        const cvs = document.getElementById('gaugeCanvas');
        const ctx = cvs.getContext('2d');
        const W = cvs.width = 300; 
        const H = cvs.height = 150;
        ctx.clearRect(0,0,W,H);
        
        ctx.beginPath();
        ctx.arc(W/2, H, 130, Math.PI, 0);
        ctx.lineWidth = 18;
        ctx.strokeStyle = "#333";
        ctx.stroke();

        if (pct > 1) pct = 1;
        const endAngle = Math.PI + (Math.PI * pct);
        let color = overrideColor || "#666"; 

        ctx.beginPath();
        ctx.arc(W/2, H, 130, Math.PI, endAngle);
        ctx.strokeStyle = color;
        ctx.stroke();
        
        const needleLen = 120;
        const needleAngle = Math.PI + (Math.PI * pct);
        const nx = W/2 + needleLen * Math.cos(needleAngle);
        const ny = H + needleLen * Math.sin(needleAngle);
        ctx.beginPath();
        ctx.moveTo(W/2, H);
        ctx.lineTo(nx, ny);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "white";
        ctx.stroke();
    }

    function endSession() {
        if(!confirm("¿Finalizar y descargar reporte?")) return;
        
        const date = new Date().toLocaleString();
        const avgHR = Math.round(
            sessionLog.filter(d => d.type === 'status').reduce((a,b)=>a+b.hr,0) /
            ((sessionLog.filter(d => d.type === 'status').length) || 1)
        );
        
        const labels = sessionLog.map(d => d.t + 's');
        const hrData = sessionLog.map(d => d.hr > 0 ? d.hr : null);
        const repData = sessionLog.map(d => d.type === 'rep' ? d.val : null); 

        const html = `<html><head><title>Reporte AbSmart</title><style>
            body{font-family:sans-serif;padding:20px;background:#f0f2f5}
